name: ElisasHorses
version: 1.0.0
main: fr.loual.myplugin.MyPlugin
api-version: '26.2'


commands:
  coords:
    description: Affiche vos coordonnées
    usage: /coords
  elisa:
    description: Dit les termes sur la goat
    usage: /elisa
  start_race:
    description: Démarre une course
    usage: /start_race <id>
  stop_race:
    description: Arrête la course actuelle
    usage: /stop_race